name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: node --experimental-strip-types --test $(find src -name '*.test.ts' | sort | tr '\n' ' ')

      - name: Next.js build
        env:
          DATABASE_URL: postgresql://localhost/unused
        run: npx next build
