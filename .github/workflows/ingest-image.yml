name: Ingest image

on:
  push:
    branches: [main]
    paths:
      - "src/platform/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "content/**"
      - "ops/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/laraib-labs/panel-club-ingest:${{ github.sha }}
            ghcr.io/laraib-labs/panel-club-ingest:latest
